function b64ToBytes(b64){var bin=atob(b64),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
var stage=document.getElementById("stage"),tabs=document.getElementById("tabs");
var frames=[],active=-1;
function fitFrame(fr){
  if(!fr||fr.style.display==="none")return;
  try{var d=fr.contentDocument;if(d&&d.documentElement){
    var hh=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);
    if(hh>60)fr.style.height=hh+"px";
  }}catch(e){}
}
function show(i){
  if(i===active)return;active=i;
  tabs.querySelectorAll("button").forEach(function(b,k){b.classList.toggle("active",k===i);});
  frames.forEach(function(fr,k){fr.style.display=(k===i)?"block":"none";});
  var fr=frames[i];
  if(!fr.getAttribute("data-loaded")){
    fr.setAttribute("data-loaded","1");
    fr.style.height="70vh";
    var url=URL.createObjectURL(new Blob([b64ToBytes(CH[i].b64)],{type:"text/html;charset=utf-8"}));
    fr.addEventListener("load",function(){
      fitFrame(fr);
      try{if(window.ResizeObserver&&fr.contentDocument&&fr.contentDocument.body){
        new ResizeObserver(function(){fitFrame(fr);}).observe(fr.contentDocument.body);
      }}catch(e){}
      [200,600,1200,2500].forEach(function(ms){setTimeout(function(){fitFrame(fr);},ms);});
    });
    fr.src=url;
  } else {
    fitFrame(fr);[120,400].forEach(function(ms){setTimeout(function(){fitFrame(fr);},ms);});
  }
  window.scrollTo(0,0);
}
CH.forEach(function(c,i){
  var b=document.createElement("button");b.textContent=c.label;b.title=c.full;
  b.addEventListener("click",function(){show(i);});tabs.appendChild(b);
  var fr=document.createElement("iframe");fr.title=c.full;fr.style.display="none";fr.setAttribute("scrolling","no");
  stage.appendChild(fr);frames.push(fr);
});
window.addEventListener("resize",function(){clearTimeout(window._ft);window._ft=setTimeout(function(){fitFrame(frames[active]);},150);});
